<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">

<title>폴더 나누기 연구</title>
<style>
  /* 모양 기준: docs/design.md (크림 바탕, 잉크 글자, 주황은 가장 중요한 버튼에만, 얇은 선·그림자 없음) */
  :root {
    color-scheme: light;
    --canvas: #f7f7f4; --canvas-soft: #fafaf7; --card: #ffffff; --ink: #26251e; --body: #5a5852;
    --muted: #807d72; --muted-soft: #a09c92; --hairline: #e6e5e0; --hairline-soft: #efeee8;
    --hairline-strong: #cfcdc4; --primary: #f54e00; --primary-active: #d04200; --on-primary: #ffffff;
    --surface-strong: #e6e5e0; --success: #1f8a65; --error: #cf2d56;
    --sans: "Pretendard Variable", Pretendard, -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    --mono: "JetBrains Mono", "Cascadia Mono", "D2Coding", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--canvas); color: var(--ink); }
  body { font-family: var(--sans); font-size: 16px; line-height: 1.5; }
  #app { max-width: 820px; margin: 0 auto; padding: 16px 16px 56px; }
  h1 { font-size: 34px; font-weight: 400; letter-spacing: -0.7px; line-height: 1.2; margin: 28px 0 14px; }
  h2 { font-size: 22px; font-weight: 400; letter-spacing: -0.11px; margin: 0 0 8px; }
  p { margin: 8px 0; color: var(--body); }
  ul.points { padding-left: 20px; margin: 12px 0 20px; color: var(--body); }
  ul.points li { margin: 7px 0; }
  .muted { color: var(--muted); font-size: 14px; }
  .strong { color: var(--ink); font-weight: 600; }
  .card { background: var(--card); border: 1px solid var(--hairline); border-radius: 12px; padding: 20px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .spread { justify-content: space-between; }

  .btn { appearance: none; border: 1px solid var(--hairline-strong); background: var(--card); color: var(--ink);
         border-radius: 8px; font: inherit; font-size: 15px; font-weight: 500; padding: 10px 18px;
         min-height: 44px; cursor: pointer; }
  .btn:hover { border-color: var(--ink); }
  .btn.primary { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
  .btn.primary:hover, .btn.primary:active { background: var(--primary-active); border-color: var(--primary-active); }
  .btn.text { border-color: transparent; background: transparent; padding-left: 4px; padding-right: 4px; }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn:focus-visible, input:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  .pill { display: inline-block; background: var(--surface-strong); color: var(--ink); border-radius: 9999px;
          padding: 4px 10px; font-size: 12px; font-weight: 600; letter-spacing: .3px; white-space: nowrap; }
  .topbar { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .bar { height: 4px; background: var(--hairline); border-radius: 99px; overflow: hidden; flex: 1; }
  .bar > span { display: block; height: 100%; background: var(--ink); }

  /* 파일 머리말 */
  .name { font-size: 18px; font-weight: 600; letter-spacing: -0.1px; margin: 6px 0 2px; word-break: break-all; }

  /* 문서 미리보기 */
  .viewer { margin-top: 12px; border: 1px solid var(--hairline); border-radius: 12px; background: var(--canvas-soft);
            overflow: hidden; }
  .viewer-bar { display: flex; justify-content: space-between; padding: 7px 12px; font-family: var(--mono);
                font-size: 11px; color: var(--muted); border-bottom: 1px solid var(--hairline); background: var(--card); }
  .viewer-body { max-height: 360px; overflow: auto; padding: 16px; }
  .paper { background: var(--card); border: 1px solid var(--hairline); max-width: 620px; margin: 0 auto;
           padding: 30px 34px; min-height: 240px; color: var(--ink); }
  .paper h3 { font-size: 19px; font-weight: 600; margin: 0 0 14px; line-height: 1.35; }
  .paper h4 { font-size: 15px; font-weight: 600; margin: 16px 0 6px; }
  .paper p { color: var(--ink); font-size: 14px; margin: 6px 0; }
  .paper ul { margin: 4px 0; padding-left: 20px; font-size: 14px; }
  .paper li { margin: 3px 0; }
  .slides { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .slide { background: var(--card); border: 1px solid var(--hairline-strong); aspect-ratio: 16 / 9; padding: 14px 16px;
           overflow: hidden; display: flex; flex-direction: column; }
  .slide.cover { justify-content: center; text-align: center; }
  .slide .st { font-size: 14px; font-weight: 600; line-height: 1.3; margin-bottom: 6px; color: var(--ink); }
  .slide.cover .st { font-size: 16px; }
  .slide ul { margin: 0; padding-left: 16px; font-size: 11.5px; color: var(--body); }
  .slide.cover ul { list-style: none; padding: 0; }
  .slide .no { margin-top: auto; align-self: flex-end; font-family: var(--mono); font-size: 10px; color: var(--muted-soft); }
  table.sheet { border-collapse: collapse; background: var(--card); font-size: 13px; min-width: 100%; }
  table.sheet td, table.sheet th { border: 1px solid var(--hairline); padding: 5px 9px; white-space: nowrap; text-align: left; }
  table.sheet th { background: var(--hairline-soft); color: var(--muted); font-family: var(--mono); font-weight: 400;
                   font-size: 11px; text-align: center; }
  pre.note { margin: 0; font-family: var(--mono); font-size: 13px; line-height: 1.6; white-space: pre-wrap;
             word-break: break-word; color: var(--ink); }
  .viewer img { max-width: 100%; height: auto; display: block; margin: 0 auto; }

  /* 고르기 */
  .q { font-size: 14px; font-weight: 600; margin: 18px 0 8px; color: var(--ink); }
  .chips { display: flex; gap: 6px; }
  .chip { flex: 1 1 0; min-width: 0; white-space: nowrap; padding: 8px 4px; font-size: 14px; }
  .chip.on { background: var(--ink); color: var(--canvas); border-color: var(--ink); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .folder { min-height: 56px; font-size: 16px; padding: 8px; }
  .folder kbd { font-family: var(--mono); font-size: 11px; color: var(--muted-soft); margin-right: 6px; }

  /* 설문 */
  fieldset { border: 0; padding: 0; margin: 22px 0; }
  legend { font-weight: 600; margin-bottom: 6px; padding: 0; }
  label.opt { display: flex; gap: 10px; align-items: flex-start; padding: 7px 0; cursor: pointer; color: var(--body); }
  label.opt input { margin-top: 4px; accent-color: var(--ink); }
  input[type=text] { width: 100%; font: inherit; padding: 12px 16px; min-height: 44px; border-radius: 8px;
                     border: 1px solid var(--hairline-strong); background: var(--card); color: var(--ink); }
  .status { margin-top: 10px; font-size: 14px; }
  .status.err { color: var(--error); } .status.ok { color: var(--success); }
  .hr { height: 1px; background: var(--hairline); margin: 26px 0; }
  .ticket { font-size: 40px; font-weight: 400; letter-spacing: -1px; color: var(--ink); margin: 0; }
  .w0 { width: 0; }
  .card .row { margin-top: 12px; }

  @media (max-width: 600px) {
    h1 { font-size: 28px; }
    .grid { grid-template-columns: repeat(2, 1fr); }
    .slides { grid-template-columns: 1fr; }
    .viewer-body { max-height: 230px; padding: 10px; }
    .paper { padding: 18px 16px; min-height: 0; }
    .chip { font-size: 13px; }
  }
</style>
</head>

preview": "2026학년도 2학기 학자금 지원 신청 안내\n\n## 신청 기간\n2026년 5월 20일 ~ 6월 18일 18:00 (기간이 지나면 신청할 수 없습니다)\n## 신청 방법\n- 지원 누리집에 로그인해 신청서 작성\n- 가구원 정보 제공 동의 (부모 또는 배우자)\n- 서류 제출 대상자는 가족관계증명서 등을 올림\n## 유의 사항\n재학생은 반드시 1차 신청 기간에 신청해야 합니다.", "view": {"type": "page", "paper": "pdf", "blocks": [{"t": "h1", "s": "2026학년도 2학기 학자금 지원 신청 안내"}, {"t": "h2", "s": "신청 기간"}, {"t": "p", "s": "2026년 5월 20일 ~ 6월 18일 18:00 (기간이 지나면 신청할 수 없습니다)"}, {"t": "h2", "s": "신청 방법"}, {"t": "li", "s": "지원 누리집에 로그인해 신청서 작성"}, {"t": "li", "s": "가구원 정보 제공 동의 (부모 또는 배우자)"}, {"t": "li", "s": "서류 제출 대상자는 가족관계증명서 등을 올림"}, {"t": "h2", "s": "유의 사항"}, {"t": "p", "s": "재학생은 반드시 1차 신청 기간에 신청해야 합니다."}]}, "image": null, "tier": "extra"}, {"id": "s018", "name": "수업 녹음 전사_1103.txt", "kind_label": "텍스트", "date": "2026-05-13", "source": "녹음 앱에서 글로 바꿔 내보냄", "preview": "마케팅원론 수업 녹음 받아쓰기\n\n(앞부분 생략) ...그래서 포지셔닝은 고객 머릿속의 자리를 정하는 겁니다.\n여러분 지각도 그려 보셨죠. 가로축 가격, 세로축 품질로 많이 그리는데 꼭 그럴 필요는 없어요.\n다음 주 팀 발표는 조별 15분, 질의응답 5분입니다. 발표 자료는 전날까지 올려 주세요.\n질문 있어요? 없으면 오늘은 여기까지.", "view": {"type": "text", "text": "마케팅원론 수업 녹음 받아쓰기\n\n(앞부분 생략) ...그래서 포지셔닝은 고객 머릿속의 자리를 정하는 겁니다.\n여러분 지각도 그려 보셨죠. 가로축 가격, 세로축 품질로 많이 그리는데 꼭 그럴 필요는 없어요.\n다음 주 팀 발표는 조별 15분, 질의응답 5분입니다. 발표 자료는 전날까지 올려 주세요.\n질문 있어요? 없으면 오늘은 여기까지."}, "image": null, "tier": "extra"}, {"id": "s019", "name": "스크린샷 2026-03-20 101512.png", "kind_label": "이미지", "date": "2026-03-20", "source": "화면 캡처", "preview": "", "view": {"type": "image"}, "image": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAoAAAAGQCAIAAACxkUZyAAA0BklEQVR42u3dZ3wURQPH8dlr6SGEkBBCC0oJID2CAoooIkUgEKSFGkBQBKRFMFRpAYRIS1CqtCgdpEpXmjSpEhAIvaSSnqvPi3uMR5K7dAL4+354QfZ29/Z2bve/Mzs7J207Hi4AAMDzJWMXAABAAAMAQAADAAACGAAAAhgAABDAAAAQwAAAgAAGAIAABgAABDAAAAQwAAAEMAAAIIABACCAAQAAAQwAAAEMAAAIYAAACGAAAEAAAwBAAAMAQAADAAACGAAAAhgAABDAAAAQwAAAgAAGAIAABgAA/1C8INsxP2jygKGjrKxtjH9e/+vS5rBVGWeSpBIlXHoPGiZXKCg5AAABnCNPHj1YuzRErVanT3Es5vTpsABJJhNCaLUavV6f/lIlrxqjJwWZLq7VareErZIkQfoCAAjgXIiLiXYvU75zr37GP/U63Zyp49RqtZW1dQ7C++GuLT87FS/RumMXygwAQADngk               "같은 파일이 여러 개 생겨요", "정리해도 금방 다시 어질러져요", "어떤 기준으로 나눌지 모르겠어요",
              "딱히 불편하지 않아요"] },

  { id: "worries", type: "many", q: "알아서 정리해 주는 앱이 있다면 걱정되는 점을 모두 골라 주세요",
    options: ["엉뚱한 곳으로 옮길까 봐", "파일이 없어질까 봐", "파일 내용이 밖으로 나갈까 봐", "컴퓨터가 느려질까 봐",
              "이름이 바뀌어서 못 찾을까 봐", "걱정되는 게 없어요"] },
  { id: "intent", type: "one", q: "그런 앱이 있다면 써 보시겠어요?",
    options: ["꼭 써 보고 싶어요", "무료면 써 볼게요", "잘 모르겠어요", "안 쓸 것 같아요"] },
];
const STORE_KEY = "fileorg_study_v2_" + DATA.digest;
const DONE_KEY = STORE_KEY + "_done";

const $app = document.getElementById("app");
let S = null; // 진행 상태

// ── 도구 ──────────────────────────────────────────────────
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid === null || kid === undefined || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
function hash32(str) {
  let x = 2166136261;
  for (let i = 0; i < str.length; i++) { x ^= str.charCodeAt(i); x = Math.imul(x, 16777619); }
  return x >>> 0;
}
function rng(seed) { // mulberry32
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function shuffled(list, seedStr) {
  const r = rng(hash32(seedStr)), a = list.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function newId() {
  const b = new Uint8Array(6);
  (self.crypto || window.crypto).getRandomValues(b);
  return Array.from(b, (x) => x.toString(16).padStart(2, "0")).join("");
}
function clean(text, max) { // 보이지 않는 제어 문자를 빼고 길이를 자릅니다
  return String(text || "").replace(/[\u0000-\u001f\u007f]/g, " ").trim().slice(0, max);
}
function store(key, value) { try { localStorage.setItem(key, value); } catch (e) { /* 저장이 막혀도 계속 */ } }
function save() { store(STORE_KEY, JSON.stringify(S)); }
function load() {
  try {
    const raw = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
    if (raw && raw.digest === DATA.digest && !raw.finished_at && Array.isArray(raw.order)) return raw;
  } catch (e) { /* 무시 */ }
  return null;
}
function alreadyDone() { try { return localStorage.getItem(DONE_KEY) === "1"; } catch (e) { return false; } }
function clearSaved() { try { localStorage.removeItem(STORE_KEY); } catch (e) { /* 무시 */ } }
const ITEMS = new Map(DATA.items.map((i) => [i.id, i]));

// ── 진행 상태와 응모권 ────────────────────────────────────
function startNew() {
  const pid = newId();
  const core = shuffled(DATA.items.filter((i) => i.tier === "core").map((i) => i.id), pid + "c");
  const extra = shuffled(DATA.items.filter((i) => i.tier !== "core").map((i) => i.id), pid + "e");
  S = {
    version: 2, client: "web", digest: DATA.digest, package: DATA.title, participant: pid,
    started_at: new Date().toISOString(), finished_at: null,
    order: core.concat(extra), core_count: core.length, limit: core.length, index: 0, shown_at: Date.now(),
    answers: {}, survey: {}, pain: {},
  };
  save();
}
function countTier(tier) { return Object.values(S.answers).filter((a) => a.tier === tier).length; }
function painAnswered() {
  return PAIN.filter((p) => { const v = S.pain[p.id]; return Array.isArray(v) ? v.length > 0 : !!v; }).length;
}
function tickets() {
  const core = countTier("core") >= S.core_count ? 1 : 0;
  return core + Math.floor(countTier("extra") / BATCH) + (painAnswered() >= PAIN_MIN ? 1 : 0);
}
const MAX_EXTRA = Math.floor(DATA.items.filter((i) => i.tier !== "core").length / BATCH);

// ── 화면 공통 ─────────────────────────────────────────────
function render(node) { document.onkeydown = null; $app.replaceChildren(node); window.scrollTo(0, 0); }
function ticketPill() { return h("span", { class: "pill" }, `응모권 ${tickets()}장`); }
function progressBar(ratio) {
  const fill = h("span", { class: "w0" });
  fill.style.width = Math.round(Math.max(0, Math.min(1, ratio)) * 100) + "%";
  return h("div", { class: "bar" }, fill);
}

function welcome() {
  const resumed = load();
  const n = DATA.items.filter((i) => i.tier === "core").length;
  const row = h("div", { class: "row" });
  if (resumed) {
    row.append(h("button", { class: "btn primary", onclick: () => { S = resumed; showCurrent(); } },
                 `이어서 하기 (${Object.keys(resumed.answers).length}개 했어요)`));
    row.append(h("button", { class: "btn", onclick: () => { clearSaved(); startNew(); showCurrent(); } }, "처음부터 다시"));
  } else {
    row.append(h("button", { class: "btn primary", onclick: () => { startNew(); showCurrent(); } }, "시작하기"));
  }
  render(h("div", null,
    h("h1", null, "받은 파일, 어느 폴더에 넣으시겠어요?"),

    h("ul", { class: "points" },
      h("li", null, h("span", { class: "strong" }, `필수 ${n}개, 약 5분`), "이에요. 파일마다 폴더를 한 번만 누르면 돼요."),
      h("li", null, "정답은 없어요. 처음 든 생각대로 고르고, 헷갈리면 '얼마나 확실한가요?'만 바꿔 주세요."),
      h("li", null, h("span", { class: "strong" }, "많이 할수록 당첨 확률이 올라가요. "),
        `필수를 마치면 응모권 1장, 그 뒤로 ${BATCH}개마다 1장, 불편함 설문에 답하면 1장을 더 드려요 (최대 ${MAX_EXTRA + 2}장).`),
      h("li", null, "추첨으로 5분께 5천 원 쿠폰을 드려요. 응모는 맨 마지막에 원하시는 분만 해요."),
      h("li", null, "이름·계정은 받지 않아요. 폴더 선택과 설문 응답만 모아요.")),
    alreadyDone() ? h("p", { class: "muted" }, "이 기기에서 이미 참여하셨어요. 다시 하셔도 응모권은 늘지 않아요.") : null,
    row,
    h("p", { class: "muted" }, "시작하면 위 내용에 동의한 것으로 봐요.")));
}

function showCurrent() {
  if (S.index >= S.order.length || S.index >= S.limit) return afterBatch();
  fileScreen();
}

// ── 문서 미리보기 ─────────────────────────────────────────
function viewer(item) {
  const v = item.view || { type: "text", text: item.preview || "" };
  let label = item.kind_label, right = "", body;
  if (v.type === "image") {
    body = h("img", { src: item.image, alt: "" });
    right = "640 x 400";
  } else if (v.type === "page") {
    const paper = h("div", { class: "paper" });
    let list = null;
    for (const b of v.blocks) {
      if (b.t === "li") { if (!list) { list = h("ul"); paper.append(list); } list.append(h("li", null, b.s)); continue; }
      list = null;
      paper.append(h(b.t === "h1" ? "h3" : b.t === "h2" ? "h4" : "p", null, b.s));
    }
    body = paper;
    right = "1 / 1 쪽";
  } else if (v.type === "slides") {
    body = h("div", { class: "slides" }, v.slides.map((s, n) =>
      h("div", { class: "slide" + (n === 0 ? " cover" : "") },
        h("div", { class: "st" }, s.title),
        h("ul", null, s.bullets.map((b) => h("li", null, b))),
        h("span", { class: "no" }, String(n + 1)))));
    right = `슬라이드 ${v.slides.length}장`;
  } else if (v.type === "sheet") {
    const width = Math.max(1, ...v.rows.map((r) => r.length));
    const letters = "ABCDEFGHIJ".split("").slice(0, width);
    body = h("table", { class: "sheet" },
      h("tr", null, h("th", null, ""), letters.map((c) => h("th", null, c))),
      v.rows.map((r, n) => h("tr", null, h("th", null, String(n + 1)),
        letters.map((_, c) => h("td", null, r[c] || "")))));
    right = "Sheet1";
  } else {
    body = h("pre", { class: "note" }, v.text);
    right = "UTF-8";
  }
  return h("div", { class: "viewer" },
    h("div", { class: "viewer-bar" }, h("span", null, label), h("span", null, right)),
    h("div", { class: "viewer-body" }, body));
}

function fileScreen() {
  const id = S.order[S.index];
  const item = ITEMS.get(id);
  const prev = S.answers[id];
  const total = S.limit;
  let conf = prev && prev.confidence ? prev.confidence : 3;
  const chips = CONFIDENCE.map(([v, label]) =>
    h("button", { class: "btn chip" + (v === conf ? " on" : ""), type: "button",
                  onclick: () => { conf = v; chips.forEach((c, n) => c.classList.toggle("on", CONFIDENCE[n][0] === v)); } },
      label));
  const grid = h("div", { class: "grid" }, DATA.folders.map((f, n) =>
    h("button", { class: "btn folder", onclick: () => pick(f, conf) }, h("kbd", null, String(n + 1)), f)));
  const left = total - S.index;
  render(h("div", null,
    h("div", { class: "topbar" },
      h("span", { class: "muted" }, `${S.index + 1} / ${total}`), progressBar(S.index / total), ticketPill()),
    h("div", { class: "name" }, item.name),
    h("div", { class: "muted" }, `받은 날 ${item.date} · ${item.source || "출처 모름"}`),
    viewer(item),
    h("p", { class: "q" }, "얼마나 확실한가요?"),
    h("div", { class: "chips" }, chips),
    h("p", { class: "q" }, "어느 폴더에 넣을까요? (누르면 다음으로)"),
    grid,
    h("div", { class: "row spread" },
      h("span", { class: "muted" }, prev ? `이전에 고른 폴더: ${prev.folder}` : (left <= 3 && S.index > 0 ? "거의 다 왔어요!" : "")),
      h("button", { class: "btn text", onclick: back, disabled: S.index === 0 }, "← 이전 파일"))));
  document.onkeydown = (e) => {
    if (e.target && ["INPUT", "TEXTAREA"].includes(e.target.tagName)) return;
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= DATA.folders.length) pick(DATA.folders[n - 1], conf);
    else if (e.key === "ArrowLeft") back();
  };
}

function pick(folder, conf) {
  const id = S.order[S.index];
  const item = ITEMS.get(id);
  const ms = Math.min(Math.max(Date.now() - S.shown_at, 0), MAX_MS);
  S.answers[id] = { name: item.name, folder, confidence: conf, unsure: conf < 3, ms, order: S.index + 1,
                    tier: item.tier === "core" ? "core" : "extra" };
  S.index += 1;
  S.shown_at = Date.now();
  save();
  showCurrent();
}
function back() {
  if (S.index > 0) { S.index -= 1; S.shown_at = Date.now(); save(); showCurrent(); }
}

function afterBatch() {
  const done = Object.keys(S.answers).length;
  if (S.order.length - S.limit <= 0) return surveyScreen();
  const first = S.limit === S.core_count;
  render(h("div", null,
    h("h1", null, first ? "필수 파일을 모두 마쳤어요" : "고마워요!"),
    h("p", { class: "ticket" }, `응모권 ${tickets()}장`),
    h("p", null, `지금까지 ${done}개를 나눠 주셨어요. ${BATCH}개를 더 하면 응모권이 한 장 늘어요. (약 2분)`),
    h("div", { class: "row" },
      h("button", { class: "btn primary", onclick: () => {
        S.limit = Math.min(S.limit + BATCH, S.order.length); S.shown_at = Date.now(); save(); showCurrent();
      } }, `${BATCH}개 더 할게요 (+1장)`),
      h("button", { class: "btn", onclick: () => { S.limit = S.index; save(); surveyScreen(); } }, "여기까지 할게요"))));
}

// ── 설문 ──────────────────────────────────────────────────
function optionList(name, options, many) {
  return options.map((o) => h("label", { class: "opt" },
    h("input", { type: many ? "checkbox" : "radio", name, value: o }), o));
}
function picked(root, name) {
  return Array.from(root.querySelectorAll(`input[name="${name}"]:checked`)).map((x) => x.value);
}

function surveyScreen() {
  const comment = h("input", { type: "text", maxlength: "300", placeholder: "한 줄이면 충분해요 (선택)" });
  const form = h("div", null,
    h("div", { class: "topbar" }, h("span", { class: "muted" }, "질문 1 / 2"), progressBar(0.5), ticketPill()),
    h("h1", null, "어떻게 나누셨나요?"),
    h("p", { class: "muted" }, "세 가지만 여쭤볼게요. 건너뛰어도 돼요."),
    h("fieldset", null, h("legend", null, "파일을 나눌 때 무엇을 가장 많이 봤나요? (여러 개 가능)"), optionList("reason", REASONS, true)),
    h("fieldset", null, h("legend", null, "폴더 구조는 어느 쪽이 편해요?"), optionList("structure", STRUCTURES, false)),
    h("fieldset", null, h("legend", null, "AI가 파일을 옮겨 준다면?"), optionList("auto_move", AUTO_MOVE, false)),
    h("fieldset", null, h("legend", null, "하고 싶은 말"), comment),
    h("button", { class: "btn primary", onclick: () => {
      S.survey = {
        reasons: picked(form, "reason"), structure: picked(form, "structure")[0] || null,
        auto_move: picked(form, "auto_move")[0] || null, comment: clean(comment.value, 300) || null,
      };
      save(); painScreen();
    } }, "다음"));
  render(form);
}

function painScreen() {
  const story = h("input", { type: "text", maxlength: "300", placeholder: "불편했던 일을 한 줄로 (선택)" });
  const note = h("p", { class: "muted" });
  const form = h("div", null);
  const read = () => {
    const out = {};
    for (const p of PAIN) {
      const v = picked(form, "pain_" + p.id);
      out[p.id] = p.type === "many" ? v : (v[0] || null);
    }
    out.story = clean(story.value, 300) || null;
    return out;
  };
  const update = () => {
    S.pain = read();
    const n = painAnswered();
    note.textContent = n >= PAIN_MIN ? "응모권 한 장이 더해졌어요." : `${PAIN_MIN}개 이상 답하면 응모권이 한 장 늘어요. (지금 ${n}개)`;
    pill.replaceWith(pill = ticketPill());
  };
  let pill = ticketPill();
  const finish = () => { S.pain = read(); submit(); };
  form.append(
    h("div", { class: "topbar" }, h("span", { class: "muted" }, "질문 2 / 2"), progressBar(1), pill),
    h("h1", null, "평소에 파일 정리, 어떠세요?"),
    h("p", { class: "muted" }, "약 1분이에요. 답하지 않고 넘어가도 돼요."),
    ...PAIN.map((p) => h("fieldset", { onchange: update }, h("legend", null, p.q),
                                 optionList("pain_" + p.id, p.options, p.type === "many"))),
    h("fieldset", null, h("legend", null, "기억나는 불편한 경험"), story),
    note,
    h("div", { class: "row" },
      h("button", { class: "btn primary", onclick: finish }, "제출하기"),
      h("button", { class: "btn text", onclick: () => { S.pain = {}; submit(); } }, "건너뛰고 제출")));
  render(form);
  update();
}

// ── 제출 ──────────────────────────────────────────────────
function resultJson() {
  const out = Object.assign({ type: "result" }, S);
  delete out.order; delete out.index; delete out.limit; delete out.shown_at;
  out.shown_count = Object.keys(S.answers).length;
  out.tickets = tickets();
  return out;
}
async function postJson(payload) {
  // 받는 쪽이 "ok"라고 답한 것을 확인해야 보낸 것으로 칩니다. 답을 못 받으면(접근 거부·한도 초과·
  // 인터넷 끊김) 실패로 보고, 화면에서 '결과 파일 저장'을 안내합니다. 조용히 사라지는 응답이 없게 하려는 것입니다.
  const stop = new AbortController();
  const timer = setTimeout(() => stop.abort(), 20000);
  try {
    const res = await fetch(COLLECT_URL, {
      method: "POST", credentials: "omit", redirect: "follow", cache: "no-store", signal: stop.signal,
      headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload),
    });
    if (!res.ok) throw new Error("status " + res.status);
    if ((await res.text()).trim() !== "ok") throw new Error("unexpected reply");
  } finally {
    clearTimeout(timer);
  }
}
function download(name, text) {
  const url = URL.createObjectURL(new Blob([text], { type: "application/json" }));
  const a = h("a", { href: url, download: name });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
async function submit() {
  S.finished_at = new Date().toISOString();
  save();
  let sent = false;
  if (COLLECT_URL) {
    render(h("div", null, h("h1", null, "보내는 중이에요…"), h("p", { class: "muted" }, "잠시만 기다려 주세요.")));
    try { await postJson(resultJson()); sent = true; } catch (e) { sent = false; }
  }
  store(DONE_KEY, "1");
  doneScreen(sent);
}

function doneScreen(sent) {
  const fileName = `파일정리AI_설문결과_${S.participant}.json`;
  const picks = DATA.ai || {};
  let same = 0, both = 0;
  for (const [id, a] of Object.entries(S.answers)) { if (picks[id]) { both += 1; if (picks[id] === a.folder) same += 1; } }
  const kids = [
    h("h1", null, "고마워요! 모두 끝났어요"),
    h("p", { class: "ticket" }, `응모권 ${tickets()}장`),
    sent
      ? h("p", { class: "status ok" }, "결과를 제출했어요. 따로 보낼 건 없어요.")
      : h("div", { class: "card" },
          h("p", null, COLLECT_URL ? "제출이 안 됐어요. 아래 버튼으로 결과 파일을 저장해서 보내 주세요."
                                   : "결과 파일을 저장해서 보내 주세요. (파일 한 개예요)"),
          h("button", { class: "btn primary", onclick: () => download(fileName, JSON.stringify(resultJson(), null, 1)) },
            "결과 파일 저장")),
    both ? h("p", null, `참고: 우리 AI는 ${both}개 중 ${same}개를 고르신 폴더와 같게 골랐어요.`) : null,
    h("div", { class: "hr" }),
    lotteryBlock(),
    h("div", { class: "hr" }),
    h("p", null, "주변 대학생 친구에게도 알려 주세요. 5분이면 돼요."),
    h("button", { class: "btn", onclick: (e) => {
      const t = location.href.split("#")[0].split("?")[0];
      (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(
        () => { e.target.textContent = "링크를 복사했어요"; }, () => { e.target.textContent = t; });
    } }, "링크 복사"),
  ];
  clearSaved();
  render(h("div", null, kids));
}

function lotteryBlock() {
  const n = tickets();
  const wrap = h("div", { class: "card" }, h("h2", null, "쿠폰 추첨에 응모하실래요? (선택)"));
  if (n < 1) {
    wrap.append(h("p", null, "필수 파일을 모두 마치면 응모할 수 있어요."));
    return wrap;
  }
  if (!COLLECT_URL) {
    wrap.append(h("p", null,
      `응모권 ${n}장으로 응모하시려면 결과 파일을 보내실 때 연락처(메신저 아이디나 이메일)를 같이 적어 주세요. ` +
      "추첨이 끝나면 연락처는 지워요."));
    return wrap;
  }
  const contact = h("input", { type: "text", maxlength: "120", autocomplete: "off", placeholder: "메신저 아이디 또는 이메일" });
  const msg = h("div", { class: "status" });
  const pid = S.participant;
  const btn = h("button", { class: "btn primary", onclick: async () => {
    const v = clean(contact.value, 120);
    if (v.length < 3) { msg.className = "status err"; msg.textContent = "연락처를 적어 주세요"; return; }
    btn.disabled = true;
    try {
      await postJson({ type: "lottery", contact: v, participant: pid, tickets: n, at: new Date().toISOString() });
      msg.className = "status ok"; msg.textContent = `응모권 ${n}장으로 응모했어요. 고마워요!`;
    } catch (e) {
      btn.disabled = false;
      msg.className = "status err"; msg.textContent = "보내지 못했어요. 잠시 뒤 다시 눌러 주세요.";
    }
  } }, `응모권 ${n}장으로 응모하기`);
  wrap.append(
    h("p", { class: "muted" },
      "응모권 수를 확인하려고 연락처와 참가 번호를 함께 저장해요. 당첨 안내에만 쓰고, 추첨이 끝나면 연락처는 지워요."),
    contact, h("div", { class: "row" }, btn), msg);
  return wrap;
}

welcome();
</script>
</body>
</html>
