<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-bpmmWtpD8bUYxqky/2D/wyc3yevMS7FWAhrKc+hoEZA='; style-src 'sha256-qodQnxpDxdSEWh5fuTOfcZFHwEz9oBI+uBq/a1dMovo='; img-src data:; connect-src https://script.google.com https://script.googleusercontent.com; base-uri 'none'; form-action 'none'">
<title>폴더 나누기 연구</title>
<style>
  /* 모양 기준: docs/design.md (크림 바탕, 잉크 글자, 주황은 가장 중요한 버튼에만, 얇은 선·그림자 없음) */
  :root {
    color-scheme: light;
    --canvas: #f7f7f4; --canvas-soft: #fafaf7; --card: #ffffff; --ink: #26251e; --body: #5a5852;
    --muted: #807d72; --muted-soft: #a09c92; --hairline: #e6e5e0; --hairline-soft: #efeee8;
    --hairline-strong: #cfcdc4; --primary: #f54e00; --primary-active: #d04200; --on-primary: #ffffff;
    --surface-strong: #e6e5e0; --success: #1f8a65; --error: #cf2d56;
    --sans: "Pretendard Variable", Pretendard, -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    --mono: "JetBrains Mono", "Cascadia Mono", "D2Coding", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--canvas); color: var(--ink); }
  body { font-family: var(--sans); font-size: 16px; line-height: 1.5; }
  #app { max-width: 820px; margin: 0 auto; padding: 16px 16px 56px; }
  h1 { font-size: 34px; font-weight: 400; letter-spacing: -0.7px; line-height: 1.2; margin: 28px 0 14px; }
  h2 { font-size: 22px; font-weight: 400; letter-spacing: -0.11px; margin: 0 0 8px; }
  p { margin: 8px 0; color: var(--body); }
  ul.points { padding-left: 20px; margin: 12px 0 20px; color: var(--body); }
  ul.points li { margin: 7px 0; }
  .muted { color: var(--muted); font-size: 14px; }
  .strong { color: var(--ink); font-weight: 600; }
  .card { background: var(--card); border: 1px solid var(--hairline); border-radius: 12px; padding: 20px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .spread { justify-content: space-between; }

  .btn { appearance: none; border: 1px solid var(--hairline-strong); background: var(--card); color: var(--ink);
         border-radius: 8px; font: inherit; font-size: 15px; font-weight: 500; padding: 10px 18px;
         min-height: 44px; cursor: pointer; }
  .btn:hover { border-color: var(--ink); }
  .btn.primary { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
  .btn.primary:hover, .btn.primary:active { background: var(--primary-active); border-color: var(--primary-active); }
  .btn.text { border-color: transparent; background: transparent; padding-left: 4px; padding-right: 4px; }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn:focus-visible, input:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  .pill { display: inline-block; background: var(--surface-strong); color: var(--ink); border-radius: 9999px;
          padding: 4px 10px; font-size: 12px; font-weight: 600; letter-spacing: .3px; white-space: nowrap; }
  .topbar { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .bar { height: 4px; background: var(--hairline); border-radius: 99px; overflow: hidden; flex: 1; }
  .bar > span { display: block; height: 100%; background: var(--ink); }

  /* 파일 머리말 */
  .name { font-size: 18px; font-weight: 600; letter-spacing: -0.1px; margin: 6px 0 2px; word-break: break-all; }

  /* 문서 미리보기 */
  .viewer { margin-top: 12px; border: 1px solid var(--hairline); border-radius: 12px; background: var(--canvas-soft);
            overflow: hidden; }
  .viewer-bar { display: flex; justify-content: space-between; padding: 7px 12px; font-family: var(--mono);
                font-size: 11px; color: var(--muted); border-bottom: 1px solid var(--hairline); background: var(--card); }
  .viewer-body { max-height: 360px; overflow: auto; padding: 16px; }
  .paper { background: var(--card); border: 1px solid var(--hairline); max-width: 620px; margin: 0 auto;
           padding: 30px 34px; min-height: 240px; color: var(--ink); }
  .paper h3 { font-size: 19px; font-weight: 600; margin: 0 0 14px; line-height: 1.35; }
  .paper h4 { font-size: 15px; font-weight: 600; margin: 16px 0 6px; }
  .paper p { color: var(--ink); font-size: 14px; margin: 6px 0; }
  .paper ul { margin: 4px 0; padding-left: 20px; font-size: 14px; }
  .paper li { margin: 3px 0; }
  .slides { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .slide { background: var(--card); border: 1px solid var(--hairline-strong); aspect-ratio: 16 / 9; padding: 14px 16px;
           overflow: hidden; display: flex; flex-direction: column; }
  .slide.cover { justify-content: center; text-align: center; }
  .slide .st { font-size: 14px; font-weight: 600; line-height: 1.3; margin-bottom: 6px; color: var(--ink); }
  .slide.cover .st { font-size: 16px; }
  .slide ul { margin: 0; padding-left: 16px; font-size: 11.5px; color: var(--body); }
  .slide.cover ul { list-style: none; padding: 0; }
  .slide .no { margin-top: auto; align-self: flex-end; font-family: var(--mono); font-size: 10px; color: var(--muted-soft); }
  table.sheet { border-collapse: collapse; background: var(--card); font-size: 13px; min-width: 100%; }
  table.sheet td, table.sheet th { border: 1px solid var(--hairline); padding: 5px 9px; white-space: nowrap; text-align: left; }
  table.sheet th { background: var(--hairline-soft); color: var(--muted); font-family: var(--mono); font-weight: 400;
                   font-size: 11px; text-align: center; }
  pre.note { margin: 0; font-family: var(--mono); font-size: 13px; line-height: 1.6; white-space: pre-wrap;
             word-break: break-word; color: var(--ink); }
  .viewer img { max-width: 100%; height: auto; display: block; margin: 0 auto; }

  /* 고르기 */
  .q { font-size: 14px; font-weight: 600; margin: 18px 0 8px; color: var(--ink); }
  .chips { display: flex; gap: 6px; }
  .chip { flex: 1 1 0; min-width: 0; white-space: nowrap; padding: 8px 4px; font-size: 14px; }
  .chip.on { background: var(--ink); color: var(--canvas); border-color: var(--ink); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .folder { min-height: 56px; font-size: 16px; padding: 8px; }
  .folder kbd { font-family: var(--mono); font-size: 11px; color: var(--muted-soft); margin-right: 6px; }

  /* 설문 */
  fieldset { border: 0; padding: 0; margin: 22px 0; }
  legend { font-weight: 600; margin-bottom: 6px; padding: 0; }
  label.opt { display: flex; gap: 10px; align-items: flex-start; padding: 7px 0; cursor: pointer; color: var(--body); }
  label.opt input { margin-top: 4px; accent-color: var(--ink); }
  input[type=text], input[type=email] { width: 100%; font: inherit; padding: 12px 16px; min-height: 44px;
                     border-radius: 8px; border: 1px solid var(--hairline-strong); background: var(--card);
                     color: var(--ink); }
  .status { margin-top: 10px; font-size: 14px; }
  .status.err { color: var(--error); } .status.ok { color: var(--success); }
  .hr { height: 1px; background: var(--hairline); margin: 26px 0; }
  .ticket { font-size: 40px; font-weight: 400; letter-spacing: -1px; color: var(--ink); margin: 0; }
  .w0 { width: 0; }
  .consent { margin: 18px 0; }
  .mail-link { text-decoration: none; display: inline-block; line-height: 20px; }
  .mail-link.off { opacity: .5; pointer-events: none; }
  p.small { font-size: 12px; }
  .card .row { margin-top: 12px; }

  /* 응모 */
  .entry-row { margin: 14px 0 6px; }
  .receipt { border-color: var(--ink); }
  .receipt .code { font-family: var(--mono); font-size: 32px; letter-spacing: 2px; color: var(--ink);
                   margin: 14px 0; user-select: all; }
  /* 개발자 모드: 아무것도 보내거나 저장하지 않는 시험 */
  .dev-banner { background: var(--ink); color: var(--canvas); border-radius: 8px; padding: 10px 14px;
                font-size: 14px; margin: 0 0 16px; }
  .dev-banner b { font-weight: 600; }

  @media (max-width: 600px) {
    h1 { font-size: 28px; }
    .grid { grid-template-columns: repeat(2, 1fr); }
    .slides { grid-template-columns: 1fr; }
    .viewer-body { max-height: 230px; padding: 10px; }
    .paper { padding: 18px 16px; min-height: 0; }
    .chip { font-size: 13px; }
  }
</style>
</head>

preview": "2026학년도 2학기 학자금 지원 신청 안내\n\n## 신청 기간\n2026년 5월 20일 ~ 6월 18일 18:00 (기간이 지나면 신청할 수 없습니다)\n## 신청 방법\n- 지원 누리집에 로그인해 신청서 작성\n- 가구원 정보 제공 동의 (부모 또는 배우자)\n- 서류 제출 대상자는 가족관계증명서 등을 올림\n## 유의 사항\n재학생은 반드시 1차 신청 기간에 신청해야 합니다.", "view": {"type": "page", "paper": "pdf", "blocks": [{"t": "h1", "s": "2026학년도 2학기 학자금 지원 신청 안내"}, {"t": "h2", "s": "신청 기간"}, {"t": "p", "s": "2026년 5월 20일 ~ 6월 18일 18:00 (기간이 지나면 신청할 수 없습니다)"}, {"t": "h2", "s": "신청 방법"}, {"t": "li", "s": "지원 누리집에 로그인해 신청서 작성"}, {"t": "li", "s": "가구원 정보 제공 동의 (부모 또는 배우자)"}, {"t": "li", "s": "서류 제출 대상자는 가족관계증명서 등을 올림"}, {"t": "h2", "s": "유의 사항"}, {"t": "p", "s": "재학생은 반드시 1차 신청 기간에 신청해야 합니다."}]}, "image": null, "tier": "extra"}, {"id": "s018", "name": "수업 녹음 전사_1103.txt", "kind_label": "텍스트", "date": "2026-05-13", "source": "녹음 앱에서 글로 바꿔 내보냄", "preview": "마케팅원론 수업 녹음 받아쓰기\n\n(앞부분 생략) ...그래서 포지셔닝은 고객 머릿속의 자리를 정하는 겁니다.\n여러분 지각도 그려 보셨죠. 가로축 가격, 세로축 품질로 많이 그리는데 꼭 그럴 필요는 없어요.\n다음 주 팀 발표는 조별 15분, 질의응답 5분입니다. 발표 자료는 전날까지 올려 주세요.\n질문 있어요? 없으면 오늘은 여기까지.", "view": {"type": "text", "text": "마케팅원론 수업 녹음 받아쓰기\n\n(앞부분 생략) ...그래서 포지셔닝은 고객 머릿속의 자리를 정하는 겁니다.\n여러분 지각도 그려 보셨죠. 가로축 가격, 세로축 품질로 많이 그리는데 꼭 그럴 필요는 없어요.\n다음 주 팀 발표는 조별 15분, 질의응답 5분입니다. 발표 자료는 전날까지 올려 주세요.\n질문 있어요? 없으면 오늘은 여기까지."}, "image": null, "tier": "extra"}, {"id": "s019", "name": "스크린샷 2026-03-20 101512.png", "kind_label": "이미지", "date": "2026-03-20", "source": "화면 캡처", "preview": "", "view": {"type": "image"}, "image": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAoAAAAGQCAIAAACxkUZyAAA0BklEQVR42u3dZ3wURQPH8dlr6SGEkBBCC0oJID2CAoooIkUgEKSFGkBQBKRFMFRpAYRIS1CqtCgdpEpXmjSpEhAIvaSSnqvPi3uMR5K7dAL4+354QfZ29/Z2bve/Mzs7J207Hi4AAMDzJWMXAABAAAMAQAADAAACGAAAAhgAABDAAAAQwAAAgAAGAIAABgAABDAAAAQwAAAEMAAAIIABACCAAQAAAQwAAAEMAAAIYAAACGAAAEAAAwBAAAMAQAADAAACGAAAAhgAABDAAAAQwAAAgAAGAIAABgAA/1C8INsxP2jygKGjrKxtjH9e/+vS5rBVGWeSpBIlXHoPGiZXKCg5AAABnCNPHj1YuzRErVanT3Es5vTpsABJJhNCaLUavV6f/lIlrxqjJwWZLq7VareErZIkQfoCAAjgXIiLiXYvU75zr37GP/U63Zyp49RqtZW1dQ7C++GuLT87FS/RumMXygwAQADngk // ── 도구 ──────────────────────────────────────────────────
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid === null || kid === undefined || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
function hash32(str) {
  let x = 2166136261;
  for (let i = 0; i < str.length; i++) { x ^= str.charCodeAt(i); x = Math.imul(x, 16777619); }
  return x >>> 0;
}
function rng(seed) { // mulberry32
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function shuffled(list, seedStr) {
  const r = rng(hash32(seedStr)), a = list.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function newId() {
  const b = new Uint8Array(6);
  (self.crypto || window.crypto).getRandomValues(b);
  return Array.from(b, (x) => x.toString(16).padStart(2, "0")).join("");
}
function clean(text, max) { // 보이지 않는 제어 문자를 빼고 길이를 자릅니다
  return String(text || "").replace(/[\u0000-\u001f\u007f]/g, " ").trim().slice(0, max);
}
function store(key, value) { try { localStorage.setItem(key, value); } catch (e) { /* 저장이 막혀도 계속 */ } }
function save() { store(STORE_KEY, JSON.stringify(S)); }
function load() {
  try {
    const raw = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
    if (raw && raw.digest === DATA.digest && !raw.finished_at && Array.isArray(raw.order)) {
      return migrate(raw);
    }
  } catch (e) { /* 무시 */ }
  return null;
}
/* 진행 중이던 저장 내용을 새 판에 맞춥니다. 모르는 파일 번호는 빼고, 새로 생긴 파일은 맨 뒤에
 * 섞어서 붙입니다(이미 푼 답과 순서는 그대로). 판 지문이 같으므로 이어하기·응모 확인도 이어집니다. */
function migrate(raw) {
  const seen = new Set();
  const order = raw.order.filter((id) => ITEMS.has(id) && !seen.has(id) && seen.add(id));
  const added = DATA.items.map((i) => i.id).filter((id) => !seen.has(id));
  raw.order = order.concat(shuffled(added, String(raw.participant) + "n"));
  if (!raw.answers || typeof raw.answers !== "object") raw.answers = {};
  if (!raw.survey || typeof raw.survey !== "object") raw.survey = {};
  if (!raw.pain || typeof raw.pain !== "object") raw.pain = {};
  raw.index = Math.max(0, Math.min(Number(raw.index) || 0, raw.order.length));
  raw.limit = Math.max(raw.core_count || 0, Math.min(Number(raw.limit) || 0, raw.order.length));
  return raw;
}

function savedResult() {

  } catch (e) { /* 무시 */ }
  return null;
}
/* 같은 기기의 중복 응답을 가려내기 위한 무작위 번호(개인 식별 정보 아님). 개발자 모드에서는 만들지 않음 */

function startNew() {

  const extra = shuffled(DATA.items.filter((i) => i.tier !== "core").map((i) => i.id), pid + "e");

function withConsent(survey) {
  // 응답자 정보(연령대·성별·직업)도 같은 칸(survey)에 실어 보냄: 받는 곳을 바꾸지 않고도 저장됨

  const device = deviceId();

                       { consent: S.consent ? S.consent.version : null });
}
function painAnswered() {
  return PAIN.filter((p) => { const v = S.pain[p.id]; return Array.isArray(v) ? v.length > 0 : !!v; }).length;
}
const CORE_IDS = new Set(DATA.items.filter((i) => i.tier === "core").map((i) => i.id));
/* 응모권: 상한 없음. 저장하는 줄(행) 단위로 세므로 받는 곳(분석)의 계산과 항상 같습니다.
 * 줄마다: 필수 20개를 모두 했으면 1장 + (필수 외 파일 5개마다 1장) + (답한 파일 25개마다 1장)
 * 사람마다: 불편함 설문 4개 이상 1장 + 모든 파일을 한 번씩 끝까지 분류하면 3장 */
function allPasses() { return (S.passes || []).concat([S.answers]); }
function rowsOf(pass) { // 한 바퀴의 답을 번호순으로 ROW_MAX개씩 나눈 줄들
  const list = Object.entries(pass).sort((a, b) => (a[1].order || 0) - (b[1].order || 0));
  const rows = [];
  for (let i = 0; i < list.length; i += ROW_MAX) rows.push(list.slice(i, i + ROW_MAX));
  return rows;
}
function allRows() { return allPasses().flatMap(rowsOf); }
function rowTickets(row) {
  const ids = row.map(([id]) => id);
  const core = CORE_IDS.size > 0 && Array.from(CORE_IDS).every((id) => ids.includes(id)) ? 1 : 0;
  const extra = ids.filter((id) => !CORE_IDS.has(id)).length;
  return core + Math.floor(extra / BATCH) + Math.floor(ids.length / MILESTONE);
}

  const seen = new Set();
  for (const p of allPasses()) for (const id of Object.keys(p)) seen.add(id);
  return DATA.items.length > 0 && DATA.items.every((i) => seen.has(i.id));
}

  return rows + (painAnswered() >= PAIN_MIN ? 1 : 0) + (completedAll() ? COMPLETE_BONUS : 0);

function viewer(item) {
  const v = item.view || { type: "text", text: item.preview || "" };
  let label = item.kind_label, right = "", body;
  if (v.type === "image") {
    body = h("img", { src: item.image, alt: "" });
    right = "640 x 400";
  } else if (v.type === "page") {
    const paper = h("div", { class: "paper" });
    let list = null;
    for (const b of v.blocks) {
      if (b.t === "li") { if (!list) { list = h("ul"); paper.append(list); } list.append(h("li", null, b.s)); continue; }
      list = null;
      paper.append(h(b.t === "h1" ? "h3" : b.t === "h2" ? "h4" : "p", null, b.s));
    }
    body = paper;
    right = "1 / 1 쪽";
  } else if (v.type === "slides") {
    body = h("div", { class: "slides" }, v.slides.map((s, n) =>
      h("div", { class: "slide" + (n === 0 ? " cover" : "") },
        h("div", { class: "st" }, s.title),
        h("ul", null, s.bullets.map((b) => h("li", null, b))),
        h("span", { class: "no" }, String(n + 1)))));
    right = `슬라이드 ${v.slides.length}장`;
  } else if (v.type === "sheet") {
    const width = Math.max(1, ...v.rows.map((r) => r.length));
    const letters = "ABCDEFGHIJ".split("").slice(0, width);
    body = h("table", { class: "sheet" },
      h("tr", null, h("th", null, ""), letters.map((c) => h("th", null, c))),
      v.rows.map((r, n) => h("tr", null, h("th", null, String(n + 1)),
        letters.map((_, c) => h("td", null, r[c] || "")))));
    right = "Sheet1";
  } else {
    body = h("pre", { class: "note" }, v.text);
    right = "UTF-8";
  }
  return h("div", { class: "viewer" },
    h("div", { class: "viewer-bar" }, h("span", null, label), h("span", null, right)),
    h("div", { class: "viewer-body" }, body));
}

function fileScreen() {
  const id = S.order[S.index];

function pick(folder, conf) {
  const id = S.order[S.index];
  const item = ITEMS.get(id);
  const ms = Math.min(Math.max(Date.now() - S.shown_at, 0), MAX_MS);
  const isNew = !(id in S.answers);
  S.answers[id] = { name: item.name, folder, confidence: conf, unsure: conf < 3, ms, order: S.index + 1,
                    tier: item.tier === "core" ? "core" : "extra" };
  S.index += 1;
  S.shown_at = Date.now();
  const count = Object.keys(S.answers).length;
  if (isNew && count % MILESTONE === 0) { // 줄(행) 안에서 25개째마다 보너스(받는 곳 계산과 같음)
    S.flash = `이벤트 달성: ${count}개를 분류하여 보너스 응모권 1장이 지급되었습니다. (현재 ${tickets()}장)`;
  }
  save();
  showCurrent();
}
function back() {
  if (S.index > 0) { S.index -= 1; S.shown_at = Date.now(); save(); showCurrent(); }
}

/* 응답 성실도(간단 점검). 최종 판단은 받은 뒤 분석에서 다시 하며, 기준은 공개하지 않습니다. */
function trust() {
  const cur = Object.values(S.answers);
  const ms = cur.map((a) => a.ms).sort((a, b) => a - b);
  const median = ms.length ? ms[Math.floor(ms.length / 2)] : 0;
  const counts = {};
  for (const a of cur) counts[a.folder] = (counts[a.folder] || 0) + 1;
  const top = cur.length ? Math.max(...Object.values(counts)) / cur.length : 1;
  let same = null;
  const prev = (S.passes || []).length ? S.passes[S.passes.length - 1] : null;
  if (prev) {
    const ids = Object.keys(S.answers).filter((id) => prev[id]);
    if (ids.length >= 20) same = ids.filter((id) => prev[id].folder === S.answers[id].folder).length / ids.length;
  }
  const ok = cur.length >= 20 && median >= TRUST_MEDIAN_MS && top < TRUST_TOP && (same === null || same >= TRUST_SAME);
  return { ok };
}

function startNextPass() {
  S.passes = (S.passes || []).concat([S.answers]);
  S.answers = {};
  S.order = shuffled(DATA.items.map((i) => i.id), S.participant + "p" + S.passes.length);
  S.index = 0;
  S.limit = S.order.length;
  S.shown_at = Date.now();
  S.flash = "다음 바퀴를 시작합니다. 파일 순서가 섞여 있으며, 응모권은 계속 늘어납니다.";
  save();
  showCurrent();
}

          h("div", { class: "row" },

// ── 제출 ──────────────────────────────────────────────────
/* 같은 사람의 응답을 저장 줄(행) 단위로 나눕니다. 첫 줄은 참가 번호 그대로이고, 이어지는 줄은
 * 그 번호에서 만든 번호와 묶음 표시(group)를 달아 보냅니다. 추첨에서는 한 사람으로 합산됩니다. */
function derivedId(k) {
  const a = hash32(S.participant + "|" + k).toString(16).padStart(8, "0");
  const b = hash32(k + "|" + S.participant).toString(16).padStart(8, "0");
  return (a + b).slice(0, 12);
}
function rowPayloads() {
  const pain = painAnswered() >= PAIN_MIN ? 1 : 0;
  return allRows().map((row, k) => {
    const head = k === 0;
    const answers = {};
    for (const [id, a] of row) answers[id] = a;
    const survey = head ? S.survey
      : { consent: S.consent ? S.consent.version : null, device: deviceId(), group: S.participant, part: String(k + 1) };
    return {
      type: "result", client: "web", digest: S.digest, package: S.package,
      participant: head ? S.participant : derivedId(k),
      started_at: S.started_at, finished_at: S.finished_at,
      shown_count: row.length, tickets: rowTickets(row) + (head ? pain : 0),
      answers, survey, pain: head ? S.pain : {},
    };
  });
}
/* 받는 쪽의 답은 "ok" 또는 "ok:응모확인번호"(뒤에 판 이름이 붙을 수 있음)뿐입니다. */
function acceptReply(reply) {
  const text = String(reply).trim();
  if (!/^(ok(:[A-Z0-9-]{4,16})?( v\d+)?|closed)$/.test(text)) throw new Error("unexpected reply");
  return text;
}
function postViaAppsScript(payload) {
  return new Promise((resolve, reject) => {
    const run = window.google && window.google.script && window.google.script.run;
    if (!run) return reject(new Error("no apps script"));
    run.withSuccessHandler((r) => { try { resolve(acceptReply(r)); } catch (e) { reject(e); } })
       .withFailureHandler((e) => reject(e))
       .receive(JSON.stringify(payload));
  });
}
async function postOnce(payload) {
  // 받는 쪽이 정해진 모양으로 답한 것을 확인해야 보낸 것으로 칩니다. 답을 못 받으면(접근 거부·한도 초과·
  // 인터넷 끊김) 실패로 보고, 화면에서 안내합니다. 조용히 사라지는 응답이 없게 하려는 것입니다.
  const stop = new AbortController();
  const timer = setTimeout(() => stop.abort(), 20000);
  try {
    const res = await fetch(COLLECT_URL, {
      method: "POST", credentials: "omit", redirect: "follow", cache: "no-store", signal: stop.signal,
      headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload),
    });
    if (!res.ok) throw new Error("status " + res.status);
    return acceptReply(await res.text());
  } finally {
    clearTimeout(timer);
  }
}
async function postJson(payload) {
  if (DEV) { // 시험: 보내지 않고, 잠깐 기다렸다가 가짜 확인 번호를 돌려줍니다.
    await new Promise((r) => setTimeout(r, 400));
    return "ok:DEV-TEST";
  }
  if (VIA_APPS_SCRIPT) return postViaAppsScript(payload);
  try {
    return await postOnce(payload);
  } catch (e) {
    // 구글 쪽이 가끔 일시적으로 오류 화면을 돌려줍니다. 한 번만 다시 시도합니다.
    await new Promise((r) => setTimeout(r, 1500));
    return postOnce(payload);
  }
}
function download(name, text) {
  const url = URL.createObjectURL(new Blob([text], { type: "application/json" }));
  const a = h("a", { href: url, download: name });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
async function submit() {
  S.finished_at = S.finished_at || new Date().toISOString();
  save();
  let sent = false, closed = false;
  if (CAN_SEND) {
    render(h("div", null, h("h1", null, "제출 중입니다"), h("p", { class: "muted" }, "잠시만 기다려 주십시오.")));
    const rows = rowPayloads();
    try {
      // 줄이 여러 개일 수 있습니다. 이미 보낸 줄은 다시 보내지 않고 이어서 보냅니다.
      for (let k = S.sent_rows || 0; k < rows.length; k++) {
        const reply = await postJson(rows[k]);
        if (reply === "closed") { closed = true; break; } // 기한이 지나 받는 곳이 받지 않음
        S.sent_rows = k + 1;
      }
      sent = !closed && (S.sent_rows || 0) >= rows.length;
    } catch (e) { sent = false; }
  }
  if (!DEV && sent) store(DONE_KEY, "1");
  if (sent) store(RESULT_KEY, JSON.stringify({ participant: S.participant, tickets: tickets(), at: S.finished_at }));
  doneScreen(sent, closed);
}

function doneScreen(sent, closed) {
  if (closed) {
    render(h("div", null, closedScreen()));
    return;
  }
  const fileName = `파일정리AI_설문결과_${S.participant}.json`;
  const picks = DATA.ai || {};
  let same = 0, both = 0;
  for (const [id, a] of Object.entries(S.answers)) { if (picks[id]) { both += 1; if (picks[id] === a.folder) same += 1; } }
  const kids = [
    h("h1", null, "참여해 주셔서 감사합니다"),
    h("p", { class: "ticket" }, `응모권 ${tickets()}장`),
    h("p", { class: "muted small" }, "※ 표시된 응모권은 응답 검토(선택 속도·다양성 등) 후 확정되며, 기준에 맞지 않는 응답은 제외될 수 있습니다."),
    sent
      ? h("p", { class: "status ok" }, DEV ? "시험 모드이므로 실제로 전송하지 않았습니다. 제출이 성공한 것으로 처리하여 이후 화면을 보여 드립니다."
                                         : "결과가 정상적으로 제출되었습니다. 별도로 보내실 내용은 없습니다.")
      : h("div", { class: "card" },
          h("p", null, (CAN_SEND ? "제출에 실패하였습니다. 아래 버튼으로 결과 파일을 저장하여 " : "결과 파일을 저장하여 ")
                        + (DATA.apply_email ? `${DATA.apply_email} 로 메일을 보내 주시기 바랍니다. (파일 1개 첨부)`
                                            : "보내 주시기 바랍니다. (파일 1개)")),
          h("div", { class: "row" },
            h("button", { class: "btn primary", onclick: () => submit() }, "다시 보내기"),
            h("button", { class: "btn", onclick: () => download(fileName, JSON.stringify(rowPayloads(), null, 1)) },
              "결과 파일 저장"))),
    both ? h("p", null, `참고: AI는 ${both}개 중 ${same}개를 선택하신 폴더와 동일하게 분류하였습니다.`) : null,
    h("div", { class: "hr" }),
    lotteryBlock(),
    h("div", { class: "hr" }),
    h("p", null, "주변 지인에게도 안내해 주시기 바랍니다. (약 5분 소요)"),
    h("button", { class: "btn", onclick: (e) => {
      const t = location.href.split("#")[0].split("?")[0];
      (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(
        () => { e.target.textContent = "링크를 복사하였습니다"; }, () => { e.target.textContent = t; });
    } }, "링크 복사"),
  ];
  clearSaved();
  render(h("div", null, kids));
}

function maskEmail(email) {
  const [name, host] = email.split("@");
  return name.slice(0, Math.min(2, name.length)) + "***@" + host;
}
function receiptKey(pid) { return "fileorg_receipt_" + DATA.digest + "_" + (pid || S.participant) + (DEV ? "_dev" : ""); }
function loadReceipt(pid) {
  try { return JSON.parse(localStorage.getItem(receiptKey(pid)) || "null"); } catch (e) { return null; }
}

/* 응모 확인서: 확인 번호는 받는 쪽(구글 표)에도 같은 번호로 남아, 나중에 이 번호로 응모했는지 확인할 수 있습니다. */
function receiptCard(r) {
  const text = [
    "[폴더 나누기 연구] 추첨 응모 확인서",
    `응모 확인 번호: ${r.code}`,
    `참가 번호: ${r.participant}`,
    `응모권: ${r.tickets}장`,
    `메일 주소: ${r.email_masked}`,
    `접수 시각: ${r.at}`,
  ].join(String.fromCharCode(10));
  const copied = h("span", { class: "status" });
  return h("div", { class: "card receipt" },
    h("h2", null, "추첨 응모가 접수되었습니다"),
    h("p", { class: "muted" }, "아래 확인 번호는 당첨 확인에 필요하므로 보관해 주시기 바랍니다. (화면 캡처 권장)"),
    h("p", { class: "code" }, r.code),
    h("ul", { class: "points" },
      h("li", null, h("span", { class: "strong" }, "참가 번호: "), r.participant),
      h("li", null, h("span", { class: "strong" }, "응모권: "), `${r.tickets}장`),
      h("li", null, h("span", { class: "strong" }, "메일 주소: "), r.email_masked),
      h("li", null, h("span", { class: "strong" }, "접수 시각: "), r.at)),
    h("div", { class: "row" },
      h("button", { class: "btn", onclick: async () => {
        try { await navigator.clipboard.writeText(text); copied.className = "status ok"; copied.textContent = "복사하였습니다"; }
        catch (e) { copied.className = "status err"; copied.textContent = "복사하지 못하였습니다. 화면을 캡처해 주시기 바랍니다"; }
      } }, "확인서 복사"), copied),
    h("p", { class: "muted small" },
      `※ 추첨 ${WINNERS}명, 상품은 문화상품권 5천 원이며, 금액과 인원은 상황에 따라 달라질 수 있습니다. 당첨 시 입력하신 메일 주소로 개별 연락드립니다.`));
}

/* info: 이미 끝낸 응답을 다시 열었을 때 { participant, tickets }. 없으면 지금 진행한 응답 */
function lotteryBlock(info) {
  const who = info ? info.participant : S.participant;
  const n = info ? info.tickets : tickets();
  const wrap = h("div", { class: "card" }, h("h2", null, "추첨 응모 (선택)"));
  if (n < 1) {
    wrap.append(h("p", null, "필수 파일 분류를 모두 완료하시면 응모하실 수 있습니다."));
    return wrap;
  }
  if (!CAN_SEND && !DEV) {
    wrap.append(h("p", null, "응모 접수는 현재 준비 중입니다. 아래 참가 번호를 보관해 주시기 바랍니다: " + who));
    return wrap;
  }
  const saved = loadReceipt(who);
  if (saved) return receiptCard(saved);

  const email = h("input", { type: "email", id: "entry-email", maxlength: "254", autocomplete: "email",
                             placeholder: "본인의 메일 주소", "aria-label": "본인의 메일 주소" });
  const ok = h("input", { type: "checkbox", id: "agree2" });
  const msg = h("div", { class: "status" });
  const send = h("button", { class: "btn primary", disabled: true }, "응모하기");
  const check = () => { send.disabled = !(ok.checked && EMAIL_RE.test(email.value.trim())); };
  email.addEventListener("input", check);
  ok.addEventListener("change", check);
  send.addEventListener("click", async () => {
    const value = email.value.trim().toLowerCase();
    if (!EMAIL_RE.test(value)) { msg.className = "status err"; msg.textContent = "메일 주소 형식을 확인해 주십시오."; return; }
    send.disabled = true; email.disabled = true;
    msg.className = "status"; msg.textContent = "접수 중입니다…";
    try {
      const reply = await postJson({
        type: "entry", email: value, participant: who, tickets: n,
        consent_entry: CONSENT_VERSION, dev: DEV ? true : undefined,
      });
      if (reply === "closed") {
        email.disabled = true; send.disabled = true;
        msg.className = "status err"; msg.textContent = "응모 기간이 종료되어 접수되지 않았습니다.";
        return;
      }
      const code = reply.startsWith("ok:") ? reply.slice(3) : "";
      if (!code) throw new Error("no code"); // 받는 쪽이 번호를 만들지 못함 → 접수된 것으로 보지 않음
      const receipt = {
        code, participant: who, tickets: n, email_masked: maskEmail(value),
        at: new Date().toLocaleString("ko-KR", { hour12: false }),
      };
      try { localStorage.setItem(receiptKey(who), JSON.stringify(receipt)); } catch (e) { /* 저장이 막혀도 계속 */ }
      wrap.replaceWith(receiptCard(receipt));
    } catch (e) {
      email.disabled = false; check();
      msg.className = "status err";
      msg.textContent = "접수되지 않았습니다. 잠시 뒤 다시 시도해 주시기 바랍니다. 계속 실패하면 아래 문의처로 참가 번호와 함께 알려 주십시오.";
    }
  });
  wrap.append(
    h("p", null, `응모권 ${n}장으로 응모하시려면 본인의 메일 주소를 입력해 주십시오. 입력하신 메일 주소로만 당첨 연락을 드리며, 다른 연락처나 아이디는 받지 않습니다.`),
    h("ul", { class: "points" },
      h("li", null, h("span", { class: "strong" }, "수집 항목: "), "메일 주소, 참가 번호."),
      h("li", null, h("span", { class: "strong" }, "수집 목적: "), "당첨 안내 및 상품 지급."),
      h("li", null, h("span", { class: "strong" }, "보유 기간: "), "상품 지급 완료 후 지체 없이 삭제."),
      h("li", null, h("span", { class: "strong" }, "동의 거부 권리: "), "응모에 동의하지 않으실 수 있으며, 응모하지 않아도 불이익이 없음.")),
    h("div", { class: "entry-row" }, email),
    h("label", { class: "opt", for: "agree2" }, ok, "위 내용을 확인하였으며, 응모를 위한 개인정보 수집·이용에 동의합니다."),
    h("div", { class: "row" }, send),
    msg,
    h("p", { class: "muted small" },
      `※ 접수가 끝나면 응모 확인 번호가 표시됩니다. 추첨 ${WINNERS}명, 상품은 문화상품권 5천 원이며, 금액과 인원은 상황에 따라 달라질 수 있습니다.`),
    DATA.apply_email ? h("p", { class: "muted small" }, `문의 및 삭제 요청: ${DATA.apply_email} (참가 번호 ${who} 함께 기재)`) : null);
  return wrap;
}

welcome();
</script>
</body>
</html>
